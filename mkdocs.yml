site_name: BCEHS Clinical Hub TangoBot
site_url: https://bcehsclinicalhub.github.io/tangoBot/
use_directory_urls: false

theme:
  name: material
  logo: assets/logo.png
  favicon: assets/favicon.ico
  palette: 
    - scheme: default
      primary: custom   # Defines the custom colors below
      accent: custom
      toggle:
        icon: material/brightness-7 
        name: Switch to dark mode
    - scheme: slate
      primary: custom   # For Dark Mode
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.tabs
    - search.suggest
    - search.highlight
    - content.code.copy
    - navigation.tabs
    - navigation.tabs.sticky # Keeps the menu visible as you scroll
    - navigation.sections    # Grouping for better organization

nav:
  - Home: index.md
  - Clinical Procedures:
      - Overview: clinical/index.md
      - Bed Bugs: clinical/bed-bugs-procedure.md
  - Operational Guidelines:
      - Overview: operational/index.md
      - Wreck Beach SOG: operational/wreck-beach-procedure.md
  - Chemical Data Sheets:
      - Overview: chemical/index.md
      - Sodium Hypochlorite: chemical/sodium-hypochlorite.md

markdown_extensions:
  - admonition
  - attr_list
  - pymdownx.details
  - pymdownx.superfences
  - toc:
      permalink: true

extra_css:
  - stylesheets/extra.css