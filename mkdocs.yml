site_name: BCEHS Clinical Hub TangoBot
site_url: https://bcehsclinicalhub.github.io/tangoBot/
use_directory_urls: false

theme:
  name: material
  logo: assets/logo.png
  favicon: assets/favicon.ico
  palette: 
    - scheme: default
      primary: custom   # Defines the custom colors below
      accent: custom
      toggle:
        icon: material/brightness-7 
        name: Switch to dark mode
    - scheme: slate
      primary: custom   # For Dark Mode
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.instant
    - navigation.tracking
    
nav:
  - Home: index.md
  - Clinical Procedures: clinical/index.md
  - Operational Guidelines: operational/index.md
  - Chemical Data Sheets: chemical/index.md

markdown_extensions:
  - admonition
  - attr_list
  - pymdownx.details
  - pymdownx.superfences
  - toc:
      permalink: true

extra_css:
  - stylesheets/extra.css