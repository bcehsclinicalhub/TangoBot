site_name: BCEHS Clinical Hub TangoBot
site_url: https://bcehsclinicalhub.github.io/TangoBot/
use_directory_urls: false

theme:
  name: material
  logo: assets/logo.png
  favicon: assets/favicon.ico
  features:
    - navigation.instant
    - search.suggest
    - search.highlight
  palette: 
    - scheme: default
      primary: red
      accent: red
      toggle:
        icon: material/brightness-7 
        name: Switch to dark mode
    - scheme: slate
      primary: red
      accent: red
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

  features:
    - navigation.instant      # Pages load without refreshing
    - navigation.tracking     # URL updates as you scroll
    - navigation.tabs         # Better for desktop view
    - search.suggest          # The "ChatBot" search feel
    - search.highlight        # Highlights the staff's search term
    - content.code.copy       # Great if staff need to copy phone numbers/codes

nav:
  - Home: index.md
  - Clinical Procedures:
      - Overview: clincial/index.md
      - Bed Bugs: clinical/bed-bugs-procedure.md
  - Operational Guidelines:
      - Overview: operational/ index.md
      - Wreck Beach SOG: operational/wreck-beach-procedure.md
  - Chemical Data Sheets:
      - Overview: chemical/ image.md
      - Bleach: chemical/sodium-hypochlorite.md

markdown_extensions:
  - admonition
  - attr_list
  - pymdownx.details
  - pymdownx.superfences
  - toc:
      permalink: true

extra_css:
  - stylesheets/extra.css