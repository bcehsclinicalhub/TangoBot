site_name: BCEHS Clinical Hub TangoBot
site_url: https://bcehsclinicalhub.github.io/tangoBot/
use_directory_urls: false

theme:
  name: material
  logo: assets/logo.png
  favicon: assets/logo.png
  palette: 
    - scheme: default
      primary: red
      accent: red
      toggle:
        icon: material/brightness-7 
        name: Switch to dark mode
    - scheme: slate
      primary: red
      accent: red
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.tabs
    - search.suggest
    - search.highlight
    - content.code.copy

nav:
  - Home: index.md
  - Clinical Procedures:
      - Overview: clinical/index.md
      - Bed Bugs: clinical/bed-bugs-procedure.md
  - Operational Guidelines:
      - Overview: operational/index.md
      - Wreck Beach SOG: operational/wreck-beach-procedure.md
  - Chemical Data Sheets:
      - Overview: chemical/index.md
      - Sodium Hypochlorite: chemical/sodium-hypochlorite.md

markdown_extensions:
  - admonition
  - attr_list
  - pymdownx.details
  - pymdownx.superfences
  - toc:
      permalink: true

extra_css:
  - stylesheets/extra.css