site_name: Clinical Hub WiKi
site_url: https://tango.bcehsclinicalhub.ca/
use_directory_urls: true

theme:
  name: material
  font:
    text: Roboto
    code: Roboto Mono
  logo: assets/logo.png
  favicon: assets/favicon.ico
  language: en
  palette: 
    - scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7 
        name: Switch to dark mode
    - scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs          # Moves top-level items to the blue header
    - navigation.tabs.sticky   # Keeps the header visible
    - navigation.sections      # Groups items
    - navigation.expand        # Prevents sidebar nesting
    - navigation.top  # This activates the official theme button
    - toc.follow
    - content.cards

nav:
  - Home: index.md
  - Paramedic Specialists: ps/index.md
  - Secondary Triage: stc/index.md

markdown_extensions:
  - admonition
  - attr_list
  - pymdownx.details
  - pymdownx.superfences
  - md_in_html
  - pymdownx.emoji:
      emoji_index: !!python/name:pymdownx.emoji.twemoji
      emoji_generator: !!python/name:pymdownx.emoji.to_svg
  - pymdownx.snippets
  - toc:
      permalink: false
      toc_depth: 2
      baselevel: 1
      separator: "-"

extra_css:
  - stylesheets/extra.css
  - stylesheets/schedule.css

extra_javascript:
  - javascripts/schedule.js

copyright: "Internal Use Only | © 2026 BC Emergency Health Services"

extra:
  search:
    placeholder: "Search TangoPulse..."

plugins:
  - search:
      indexing: 'full'
      # This is the secret: only index the main page title (level 1)
      heading_level: 1 
  - glightbox