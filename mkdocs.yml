site_name: Clinical Hub TangoDx
site_url: https://tango.bcehsclinicalhub.ca/
use_directory_urls: true

theme:
  name: material
  font:
    text: Roboto
    code: Roboto Mono
  logo: assets/logo.png
  favicon: assets/favicon.ico
  language: en
  palette: 
    - scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7 
        name: Switch to dark mode
    - scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.instant
    - navigation.top  # This enables the official 'Back to Top' button

nav:
  - Home: index.md
  - Paramedic Specialists:
    - Specialist Home: ps/index.md
    - Clinical Pearls: ps/clinical.md
    - Operational Memos: ps/operational.md
    - Training: ps/training.md
  - Secondary Triage:
    - Triage Home: stc/index.md
    - Algorithms: stc/algorithms.md
    - Dispatch Protocols: stc/dispatch.md

markdown_extensions:
  - admonition
  - attr_list
  - pymdownx.details
  - pymdownx.superfences
  - md_in_html
  - pymdownx.emoji:
      emoji_index: !!python/name:pymdownx.emoji.twemoji
      emoji_generator: !!python/name:pymdownx.emoji.to_svg
  - pymdownx.snippets
  - toc:
      permalink: false

extra_css:
  - stylesheets/extra.css

copyright: "Internal Use Only | © 2026 BC Emergency Health Services"

extra:
  search:
    placeholder: "Search TangoPulse..."

plugins:
  - search
  - glightbox