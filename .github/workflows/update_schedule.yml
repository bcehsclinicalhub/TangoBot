name: Update Schedule

on:
  schedule:
    - cron: '52 * * * *'   # Every hour
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download latest schedule
        env:
          SECRET_URL: ${{ secrets.BYTEBLOC_URL }}
        run: |
          set -e

          # We will attempt to download twice. If we get rate limited on attempt 1,
          # we wait out the 10-minute cooldown and try one more time.
          for attempt in 1 2; do
            echo "Downloading latest schedule (Attempt $attempt)..."

            HTTP_CODE=$(curl \
              --silent \
              --show-error \
              --location \
              --connect-timeout 30 \
              --max-time 120 \
              --write-out "%{http_code}" \
              --output schedule.tmp \
              "$SECRET_URL")

            echo "HTTP Status: $HTTP_CODE"

            if [ "$HTTP_CODE" != "200" ]; then
              echo "Download failed with HTTP Status: $HTTP_CODE"
              rm -f schedule.tmp
              exit 1
            fi

            if [ ! -s schedule.tmp ]; then
              echo "Downloaded file is empty."
              rm -f schedule.tmp
              exit 1
            fi

            # Check for the actual error strings returned by ByteBloc
            if grep -qi "ByteBloc rate limit reached" schedule.tmp || grep -qi "called at most once every 10 min" schedule.tmp; then
              if [ "$attempt" -eq 1 ]; then
                echo "ByteBloc rate limit reached. Waiting 10.5 minutes (630s) to clear the cooldown..."
                rm -f schedule.tmp
                sleep 630
                continue
              else
                echo "ByteBloc rate limit reached again on attempt 2. Exiting."
                rm -f schedule.tmp
                exit 1
              fi
            fi

            # If we reached here without continuing, the download succeeded. Break the retry loop.
            break
          done

          if ! grep -q "^<" schedule.tmp; then
            echo "Response is not XML."
            cat schedule.tmp
            rm -f schedule.tmp
            exit 1
          fi

          sudo apt-get update >/dev/null
          sudo apt-get install -y libxml2-utils >/dev/null

          if ! xmllint --noout schedule.tmp; then
            echo "XML is malformed."
            rm -f schedule.tmp
            exit 1
          fi

          ROOT=$(xmllint --xpath 'name(/*)' schedule.tmp)

          if [ "$ROOT" != "Schedule" ]; then
            echo "Unexpected XML root element: $ROOT"
            rm -f schedule.tmp
            exit 1
          fi

          mkdir -p docs/assets

          if [ -f docs/assets/data.xml ]; then
            if cmp -s schedule.tmp docs/assets/data.xml; then
              echo "Schedule unchanged."
              rm schedule.tmp
              exit 0
            fi
          fi

          mv schedule.tmp docs/assets/data.xml
          echo "Schedule updated successfully."

      - name: Commit updated schedule
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add docs/assets/data.xml

          if git diff --cached --quiet; then
            echo "Nothing changed."
            exit 0
          fi

          git commit -m "Update schedule"
          git push
